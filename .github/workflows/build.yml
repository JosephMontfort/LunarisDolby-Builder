name: Build LunarisDolby APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop openjdk-17-jdk pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 unzip

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -o "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+rx "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Build APK
        env:
          ROM_MANIFEST_URL: "https://github.com/crdroidandroid/android.git"
          ROM_BRANCH: "16.0"
          LUNCH_TARGET: "crdroid_garnet-userdebug"
          MODULE_NAME: "LunarisDolby"
          JOBS: "8"
        run: |
          bash scripts/build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarisDolby-apk
          path: artifacts/LunarisDolby.apk
